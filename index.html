<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project GUPTI | Secret Gateway</title>
    <!-- GSAP for smooth cinematic animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Google Fonts for a more romantic, premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Beautiful Romantic Gradient Background */
            background: linear-gradient(135deg, #2b1055, #7597de, #f26f8d, #fbb873);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        /* Smooth moving background animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Premium Glassmorphism Card */
        .glass-box {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15); /* Slightly brighter glass */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 50px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 12px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Input field where text is VISIBLE */
        input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Placeholder color */
        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            font-size: 0.9rem;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
        }

        .error-msg {
            color: #ffcccc;
            font-size: 0.85rem;
            margin-top: 15px;
            opacity: 0;
            font-weight: 400;
            background: rgba(255, 0, 0, 0.2);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,0,0,0.3);
        }

        /* Shake Animation for Wrong Password */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Enter Button */
        .submit-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #2b1055;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .submit-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="glass-box" id="level1-box">
        <h2>Secret Gateway</h2>
        <!-- Text changed to be more mysterious -->
        <p>A special world awaits. Enter the secret passkey to unlock.</p>
        
        <!-- Placeholder updated -->
        <input type="text" id="passkey" placeholder="Enter secret code..." autocomplete="off">
        
        <button class="submit-btn" id="submit-btn">Unlock</button>

        <div class="error-msg" id="error">Wrong passkey! Dimaag lagao thoda 😂</div>
    </div>

    <script>
        const inputField = document.getElementById('passkey');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error');
        const glassBox = document.getElementById('level1-box');

        function checkPassword() {
            const val = inputField.value.trim().toLowerCase();
            
            // MAGIC HERE: Accepts both "nakhrebaaz" and "nakhrebaaj"
            if (val === 'nakhrebaaz' || val === 'nakhrebaaj') {
                // CORRECT PASSWORD - Smooth cinematic exit
                errorMsg.style.opacity = '0';
                inputField.style.borderColor = '#ffffff';
                inputField.style.background = 'rgba(255, 255, 255, 0.5)';
                
                // Cinematic fade out and scale up
                gsap.to(glassBox, {
                    scale: 1.2,
                    opacity: 0,
                    duration: 1,
                    ease: "power2.inOut",
                    onComplete: () => {
                        window.location.href = "level2.html";

                    }
                });
            } else {
                // WRONG PASSWORD - Shake and show tease
                errorMsg.style.opacity = '1';
                glassBox.classList.remove('shake');
                void glassBox.offsetWidth; // Trigger reflow
                glassBox.classList.add('shake');
                inputField.value = ''; // clear input so she tries again
            }
        }

        // Allow pressing Enter on keyboard
        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Allow tapping the Unlock button
        submitBtn.addEventListener('click', checkPassword);

    </script>
</body>
</html>
